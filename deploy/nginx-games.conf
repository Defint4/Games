# /etc/nginx/sites-available/games
# Premier déploiement : sans les lignes « managed by Certbot » (le certificat n'existe
# pas encore), puis `sudo certbot --nginx -d games.matthieuguiot.dev` les ajoute avec la
# redirection 80 → 443. Nécessite /etc/nginx/snippets/cloudflare-real-ip.conf
# (deploy/nginx-cloudflare-real-ip.conf).

# Connexions gardées ouvertes entre nginx et les deux serveurs, au lieu d'en ouvrir une
# par requête.
upstream games_api {
    server 127.0.0.1:8003;
    keepalive 16;
    # Plus court que celui des serveurs (5 s pour uvicorn comme pour Node) : nginx ne
    # réutilise jamais une connexion qu'ils viennent de fermer (un POST échouerait en 502).
    keepalive_timeout 4s;
}

upstream games_web {
    server 127.0.0.1:3003;
    keepalive 16;
    # Plus court que celui des serveurs (5 s pour uvicorn comme pour Node) : nginx ne
    # réutilise jamais une connexion qu'ils viennent de fermer (un POST échouerait en 502).
    keepalive_timeout 4s;
}

# « upgrade » pour un WebSocket, rien pour une requête normale : forcer « upgrade »
# partout interdisait de réutiliser la connexion (keepalive ci-dessus).
map $http_upgrade $games_connection {
    default upgrade;
    ""      "";
}

server {
    server_name games.matthieuguiot.dev;

    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    # API REST.
    location /api/ {
        proxy_pass http://games_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets : une table (/api/rooms/<code>/ws) et la liste des tables en direct
    # (/api/rooms/live). Ils restent ouverts toute la partie sans forcément parler : sans
    # ces délais, nginx les couperait après 60 s de silence. Réservés à ces deux adresses
    # pour qu'une requête REST bloquée, elle, échoue au bout de 60 s et pas d'une heure.
    location ~ ^/api/rooms/(live|[^/]+/ws)$ {
        proxy_pass http://games_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $games_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://games_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $games_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # L'app redémarre (déploiement) : la page de maintenance plutôt qu'une erreur,
        # en 503 (le code d'une indisponibilité passagère, que Cloudflare laisse passer).
        error_page 502 504 =503 /maintenance.html;
    }

    location = /maintenance.html {
        root /var/www/games/deploy;
        internal;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "10" always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/games.matthieuguiot.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/games.matthieuguiot.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = games.matthieuguiot.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name games.matthieuguiot.dev;
    return 404; # managed by Certbot
}
