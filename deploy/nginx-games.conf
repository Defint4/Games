# /etc/nginx/sites-available/games
# Suppose les fichiers communs du serveur installés (README du portfolio, section 0 :
# hardening.conf, snippets tls.conf et cloudflare-real-ip.conf) et le certificat obtenu :
#   sudo certbot certonly --nginx -d games.matthieuguiot.dev

# Connexions gardées ouvertes entre nginx et les deux serveurs, au lieu d'en ouvrir une
# par requête.
upstream games_api {
    server 127.0.0.1:8003;
    keepalive 16;
    # Plus court que celui des serveurs (5 s pour uvicorn comme pour Node) : nginx ne
    # réutilise jamais une connexion qu'ils viennent de fermer (un POST échouerait en 502).
    keepalive_timeout 4s;
}

upstream games_web {
    server 127.0.0.1:3003;
    keepalive 16;
    # Plus court que celui des serveurs (5 s pour uvicorn comme pour Node) : nginx ne
    # réutilise jamais une connexion qu'ils viennent de fermer (un POST échouerait en 502).
    keepalive_timeout 4s;
}

# « upgrade » pour un WebSocket, rien pour une requête normale : forcer « upgrade »
# partout interdisait de réutiliser la connexion (keepalive ci-dessus).
map $http_upgrade $games_connection {
    default upgrade;
    ""      "";
}

server {
    listen 443 ssl;
    server_name games.matthieuguiot.dev;
    ssl_certificate /etc/letsencrypt/live/games.matthieuguiot.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/games.matthieuguiot.dev/privkey.pem;
    include /etc/nginx/snippets/tls.conf;

    # Format commun (hardening.conf), sans la chaîne de requête : le jeton joueur du
    # WebSocket y passe (?token=).
    access_log /var/log/nginx/games.access.log main;

    # 40 connexions simultanées par IP visiteur (zone de hardening.conf). Les WebSockets
    # restent ouverts des heures : sans plafond, une seule adresse pourrait occuper les
    # connexions de nginx, que les trois sites partagent. Large, pour les joueurs qui
    # sortent par la même adresse d'opérateur mobile.
    limit_conn perip 40;

    # En-têtes de sécurité : pas d'intégration dans une page tierce, pas de devinette de
    # type, adresse d'origine réduite, HTTPS imposé au navigateur.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Politique de contenu : tout vient du site lui-même. Les exceptions sont celles dont
    # les jeux ont besoin : scripts en ligne (Next en injecte dans chaque page), wasm
    # (moteur d'échecs, physique et textures de RT1), workers et textures en blob: (3D),
    # WebSocket des tables. Vérifiée en partie réelle sur les six jeux avant d'être imposée.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss://games.matthieuguiot.dev blob:; worker-src 'self' blob:; media-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # API REST.
    location /api/ {
        proxy_pass http://games_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets : une table (/api/rooms/<code>/ws) et la liste des tables en direct
    # (/api/rooms/live). Ils restent ouverts toute la partie sans forcément parler : sans
    # ces délais, nginx les couperait après 60 s de silence. Réservés à ces deux adresses
    # pour qu'une requête REST bloquée, elle, échoue au bout de 60 s et pas d'une heure.
    location ~ ^/api/rooms/(live|[^/]+/ws)$ {
        proxy_pass http://games_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $games_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://games_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $games_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # L'app redémarre (déploiement) : la page de maintenance plutôt qu'une erreur,
        # en 503 (le code d'une indisponibilité passagère, que Cloudflare laisse passer).
        error_page 502 504 =503 /maintenance.html;
    }

    location = /maintenance.html {
        root /var/www/games/deploy;
        internal;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "10" always;
    }
}

server {
    listen 80;
    server_name games.matthieuguiot.dev;
    return 301 https://$host$request_uri;
}
