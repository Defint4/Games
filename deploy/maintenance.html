<!doctype html>
<!-- Servie par nginx pendant les quelques secondes où l'app redémarre (déploiement) :
     voir deploy/nginx-games.conf. Autonome : ni le serveur de l'app ni ses fichiers ne
     répondent à ce moment-là. Elle se recharge seule jusqu'au retour de l'app. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c2c22">

<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 2.5rem 1.5rem max(2rem, env(safe-area-inset-bottom));
    box-sizing: border-box; text-align: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #faf7ee;
    background: radial-gradient(120vmax 90vmax at 50% 30%, #1a4d3d 0%, #123b2f 55%, #0c2c22 100%) #0c2c22;
  }
  main { max-width: 26rem; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
  .logo { width: 132px; height: 132px; filter: drop-shadow(0 8px 18px rgba(0,0,0,.35)); }
  .logo svg { width: 100%; height: 100%; }
  h1 { margin: 0; font-size: 1.6rem; font-weight: 800; }
  p { margin: 0; color: rgba(232,226,210,.85); line-height: 1.5; }
  .auto { display: flex; align-items: center; gap: .5rem; font-size: .875rem; color: rgba(232,226,210,.65); }
  .dot { width: .5rem; height: .5rem; border-radius: 50%; background: #e5b54a; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
</style>
</head>

  <h1 id="title">Maintenance en cours</h1>
  <p id="body">On améliore l’app. Elle revient dans quelques instants.</p>
  <p class="auto"><span class="dot"></span><span id="auto">Cette page se rouvrira toute seule.</span></p>
</main>
<script>
  if (!/^fr/i.test(navigator.language || "")) {
    document.documentElement.lang = "en";
    document.getElementById("title").textContent = "Under maintenance";
    document.getElementById("body").textContent = "We’re improving the app. It’ll be back in a moment.";
    document.getElementById("auto").textContent = "This page will reopen by itself.";
  }
  // L'app redémarre en quelques secondes : on retente jusqu'à son retour.
  setTimeout(function () { location.reload(); }, 5000);
</script>
</body>
</html>
